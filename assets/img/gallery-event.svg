<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03020b"/><stop offset="1" stop-color="#1b0f3d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="fw">
      <g stroke-width="3" stroke-linecap="round">
        <path d="M0 -70V-20M0 20V70M-70 0H-20M20 0H70M-50 -50-15 -15M15 15 50 50M50 -50 15 -15M-15 15-50 50"/>
      </g>
    </g>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <g filter="url(#glow)">
    <use href="#fw" transform="translate(200 130)" stroke="#ff3d81"/>
    <use href="#fw" transform="translate(420 90) scale(1.3)" stroke="#3df5ff"/>
    <use href="#fw" transform="translate(630 160) scale(.9)" stroke="#ffd36e"/>
    <use href="#fw" transform="translate(320 220) scale(.6)" stroke="#7b5cff"/>
  </g>
  <g fill="#060311">
    <path d="M0 500V330h60v-40h50v60h40V260h70v90h40v-50h60v200Z"/>
    <path d="M320 500V240h80v-40h20v40h50v260Z"/>
    <path d="M470 500V300h60v-50h70v80h50v-40h70v70h80v140Z"/>
  </g>
  <g fill="#ffd36e" opacity=".7">
    <rect x="80" y="310" width="6" height="8"/><rect x="180" y="280" width="6" height="8"/><rect x="200" y="300" width="6" height="8"/>
    <rect x="340" y="260" width="6" height="8"/><rect x="370" y="290" width="6" height="8"/><rect x="560" y="280" width="6" height="8"/>
    <rect x="700" y="340" width="6" height="8"/><rect x="580" y="320" width="6" height="8"/>
  </g>
  <rect x="250" y="400" width="300" height="60" rx="12" fill="none" stroke="#3df5ff" stroke-width="3" filter="url(#glow)"/>
  <text x="400" y="441" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30" fill="#3df5ff" filter="url(#glow)">EVENT NIGHT</text>
</svg>
